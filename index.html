    <script>
                $(document).ready(function() {
                    var todayCard = 0;
                    var today = new Date();
                    var todaym = new Date(2000,today.getMonth(),today.getDate());
                    var fulldata;

                    $.getJSON('key_figure.json').done(function (data){
                        fulldata = data;
                        var slide_data = data['timeline']['date'];
                        for (i = 0; i < slide_data.length; i++){
                            var dates = slide_data[i]['startDate'].split(',');
                            if(todaym <= new Date(dates[0], dates[1] - 1, dates[2])){
                                todayCard = i + 1;
                                break;
                            }
                        }
                        createStoryJS({
                            width: "100%",
                            height: "100%",
                            source: fulldata,
                            font:    'BreeSerif-OpenSans',
                            hash_bookmark:  true,
                            lang:    'zh-cnm',
                            start_zoom_adjust: -3,
                            start_at_slide: todayCard,
                            debug:   false,
                            embed_id:   'keyfigure-timeline'
                        });
                    });
                });
    </script>

    <!-- 相册集逻辑 -->
    <script>
      // 相册数据：新增相册集就在这里加一段；photos 里放该集的照片
      var ALBUMS = [
        {
          id: 'activity',
          title: '班级活动',
          desc: '班级集体活动、会议照片',
          photos: [
            { src: 'img/1.jpg', title: '选举工作安排' }
          ]
        }
        {
          id: 'activity2',
          title: '????',
          desc: '烧烤来的',
          photos: [
            { src: 'img/1.jpg', title: '烧烤' }
          ]
        }
      ];
      var currentAlbum = null;
      var previewByAlbum = {};

      function getAlbum(id) {
        for (var i = 0; i < ALBUMS.length; i++) {
          if (ALBUMS[i].id === id) return ALBUMS[i];
        }
        return null;
      }

      function renderSetList() {
        var grid = document.getElementById('album-set-grid');
        grid.innerHTML = '';
        ALBUMS.forEach(function (album) {
          var photos = album.photos.concat(previewByAlbum[album.id] || []);
          var card = document.createElement('div');
          card.className = 'album-set-card';
          if (photos.length) {
            var img = document.createElement('img');
            img.src = photos[0].src; img.alt = album.title;
            card.appendChild(img);
          } else {
            var ph = document.createElement('div');
            ph.className = 'album-set-ph'; ph.textContent = '暂无照片';
            card.appendChild(ph);
          }
          var cap = document.createElement('div'); cap.className = 'album-caption';
          var h3 = document.createElement('h3'); h3.textContent = album.title; cap.appendChild(h3);
          var count = document.createElement('p'); count.className = 'album-count'; count.textContent = photos.length + ' 张照片'; cap.appendChild(count);
          if (album.desc) { var p = document.createElement('p'); p.textContent = album.desc; cap.appendChild(p); }
          card.appendChild(cap);
          card.addEventListener('click', function () { openAlbum(album.id); });
          grid.appendChild(card);
        });
      }

      function openAlbum(id) {
        currentAlbum = getAlbum(id);
        if (!currentAlbum) return;
        document.getElementById('album-set-view').style.display = 'none';
        document.getElementById('album-photo-view').style.display = 'block';
        document.getElementById('album-inner-title').textContent = currentAlbum.title;
        document.getElementById('album-inner-desc').textContent = currentAlbum.desc || '';
        renderPhotoGrid();
      }

      function renderPhotoGrid() {
        var grid = document.getElementById('album-photo-grid');
        var photos = currentAlbum.photos.concat(previewByAlbum[currentAlbum.id] || []);
        grid.innerHTML = '';
        if (!photos.length) {
          grid.innerHTML = '<p class="muted">这个相册集还没有照片。</p>';
          return;
        }
        photos.forEach(function (ph) {
          var card = document.createElement('div'); card.className = 'album-card';
          var img = document.createElement('img'); img.src = ph.src; img.alt = ph.title;
          var cap = document.createElement('div'); cap.className = 'album-caption';
          var h3 = document.createElement('h3'); h3.textContent = ph.title; cap.appendChild(h3);
          card.appendChild(img); card.appendChild(cap);
          card.addEventListener('click', function () { openLightbox(ph.src, ph.title); });
          grid.appendChild(card);
        });
      }

      document.getElementById('album-back').addEventListener('click', function () {
        document.getElementById('album-photo-view').style.display = 'none';
        document.getElementById('album-set-view').style.display = 'block';
        currentAlbum = null;
        renderSetList();
      });

      document.getElementById('album-pick').addEventListener('change', function (e) {
        if (!currentAlbum) return;
        var arr = previewByAlbum[currentAlbum.id] = previewByAlbum[currentAlbum.id] || [];
        Array.prototype.forEach.call(e.target.files, function (f) {
          arr.push({ src: URL.createObjectURL(f), title: f.name.replace(/\.[^.]+$/, '') });
        });
        renderPhotoGrid();
      });

      renderSetList();
    </script>

    <!-- 大图灯箱 -->
    <script>
      var lightbox = document.getElementById('lightbox');
      var lightboxImg = document.getElementById('lightbox-img');
      var lightboxTitle = document.getElementById('lightbox-title');
      function openLightbox(src, title) {
        lightboxImg.src = src;
        lightboxTitle.textContent = title || '';
        lightbox.classList.add('open');
      }
      function closeLightbox() {
        lightbox.classList.remove('open');
        lightboxImg.src = '';
      }
      document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLightbox(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });
    </script>

    <!-- ===== SPA 分页路由 ===== -->
    <script>
      (function () {
        var PAGES = ['home', 'timeline', 'album', 'discuss', 'contact'];
        var TITLES = { home: '首页', timeline: '时间线', album: '相册', discuss: '讨论', contact: '联系' };

        function showPage(name) {
          if (PAGES.indexOf(name) === -1) name = 'timeline';
          for (var i = 0; i < PAGES.length; i++) {
            var el = document.getElementById('page-' + PAGES[i]);
            if (el) el.style.display = (PAGES[i] === name) ? 'block' : 'none';
          }
          var links = document.querySelectorAll('#rail-nav a[data-page], #mobile-menu a[data-page]');
          for (var j = 0; j < links.length; j++) {
            if (links[j].getAttribute('data-page') === name) {
              links[j].classList.add('active');
            } else {
              links[j].classList.remove('active');
            }
          }
          var title = document.getElementById('top-title');
          if (title) title.textContent = TITLES[name] || name;
          var menu = document.getElementById('mobile-menu');
          if (menu) menu.classList.remove('open');
          window.scrollTo(0, 0);
          // 回到时间线时通知 TimelineJS 重新计算尺寸
          if (name === 'timeline') {
            setTimeout(function () {
              window.dispatchEvent(new Event('resize'));
            }, 60);
          }
        }

        function route() {
          var h = location.hash.replace(/^#\//, '');
          showPage(h || 'timeline');
        }

        // 手机端汉堡菜单
        var toggle = document.getElementById('nav-toggle');
        var menu = document.getElementById('mobile-menu');
        if (toggle && menu) {
          toggle.addEventListener('click', function () {
            menu.classList.toggle('open');
          });
        }

        window.addEventListener('hashchange', route);
        route();
      })();
    </script>
  </body>
</html>
